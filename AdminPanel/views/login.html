<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="websiteNameTitle">Login</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">

    <script src="/public/login.js" defer></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            margin: 0;
        }

        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.24;
            animation: float 20s infinite ease-in-out alternate;
        }

        .shape-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: var(--color-blue);
        }

        .shape-2 {
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: var(--color-purple);
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(30px, 50px);
            }
        }

        .form-container {
            width: 100%;
            max-width: 560px;
            padding: 1.4rem;
            z-index: 10;
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 1.35rem;
            width: 100%;
        }

        .brand-header {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-areas:
                "logo title"
                "logo subtitle";
            column-gap: 0.9rem;
            align-items: center;
            margin-bottom: 1rem;
            text-align: left;
        }

        .brand-icon {
            grid-area: logo;
            font-size: 2.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            filter: drop-shadow(0 8px 28px rgba(91, 127, 255, 0.14));
        }

        .form-title {
            grid-area: title;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.1rem;
        }

        .form-subtitle {
            grid-area: subtitle;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }

        #loginForm {
            display: grid;
            gap: 0;
        }

        .form-group {
            margin-bottom: 1.05rem;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            margin-left: 0.25rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:focus {
            border-color: var(--color-blue);
            box-shadow: 0 0 0 4px rgba(91, 127, 255, 0.15);
            outline: none;
        }

        .input-icon {
            position: absolute;
            left: 0.8rem;
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.2s;
            font-size: 1rem;
        }

        .form-input:focus+.input-icon,
        .form-input:not(:placeholder-shown)+.input-icon {
            color: var(--color-blue);
        }

        .btn-full {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.025em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-blue) 0%, #4f6be0 100%);
            border: none;
            color: white;
            box-shadow: 0 8px 28px rgba(91, 127, 255, 0.16);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(91, 127, 255, 0.4);
            filter: brightness(1.1);
        }

        .auth-actions {
            margin-top: 0;
        }

        .auth-actions .btn {
            min-width: 0;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 42px;
            line-height: 1.2;
            margin: 0;
            border-width: 1px;
            padding: 0.75rem 1rem;
            text-align: center;
            white-space: nowrap;
        }

        .auth-actions a.btn {
            text-decoration: none;
        }

        .auth-actions button.btn {
            font: inherit;
            appearance: none;
            -webkit-appearance: none;
        }

        .aux-actions {
            margin-top: 0.65rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .aux-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 600;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .aux-link:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .captcha-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            align-items: center;
        }

        .captcha-question {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin: 0.2rem 0 0;
        }

        .captcha-refresh {
            min-height: 42px;
            white-space: nowrap;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .message.error {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff8fa3;
        }

        .message.success {
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #75ec9c;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 1rem;
            }

            .auth-card {
                padding: 1rem;
            }

            .brand-header {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "logo"
                    "title"
                    "subtitle";
                text-align: center;
            }

            .brand-icon {
                margin: 0 auto;
            }

            .aux-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="form-container">
        <div class="auth-card">
            <div class="brand-header">
                <div class="brand-icon">🔐</div>
                <h1 class="form-title"><span class="websiteName"></span></h1>
                <p class="form-subtitle">Sign in to continue to your dashboard</p>
            </div>

            <div id="errorMsg" class="message error hidden"></div>
            <div id="successMsg" class="message success hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" class="form-input"
                            placeholder="Enter your username" required autocomplete="username">
                        <span class="input-icon">👤</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Enter your password" required autocomplete="current-password">
                        <span class="input-icon">🔒</span>
                    </div>
                    <p class="form-hint" id="keyboardHint">Press Enter to sign in</p>
                    <p class="form-warning hidden" id="capsWarning" role="status" aria-live="polite">Caps Lock is on</p>
                </div>

                <div class="form-group" id="loginCaptchaGroup">
                    <label for="captchaAnswer" class="form-label">Captcha</label>
                    <p id="captchaQuestion" class="captcha-question">Loading captcha challenge...</p>
                    <div class="captcha-row">
                        <div class="input-wrapper">
                            <input type="text" id="captchaAnswer" name="captchaAnswer" class="form-input"
                                placeholder="Enter captcha answer" required autocomplete="off" inputmode="numeric">
                            <span class="input-icon">🛡️</span>
                        </div>
                        <button type="button" id="refreshCaptchaBtn" class="btn aux-link captcha-refresh"
                            aria-label="Refresh captcha">↻ Refresh</button>
                    </div>
                </div>

                <div class="form-group" id="loginTwoFactorGroup" style="display:none;">
                    <label class="form-label" for="loginTwoFactorCode">2FA Code</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginTwoFactorCode" class="form-input" placeholder="Enter 6-digit code"
                            inputmode="numeric" maxlength="6" autocomplete="one-time-code">
                        <span class="input-icon">🔐</span>
                    </div>
                    <small class="form-hint">Use the code from your authenticator app.</small>
                </div>
            </form>

            <div class="auth-actions">
                <button type="button" id="loginBtn" class="btn btn-primary btn-full">Sign In</button>
                <div class="aux-actions">
                    <a href="/register" id="registerLink" class="aux-link">Create Account</a>
                    <a href="/recovery" id="recoveryLink" class="aux-link">Recover Account</a>
                </div>
            </div>
        </div>
    </div>


    <div class="loading" id="loading" style="display:none;">
        <div class="spinner"></div>
        <p>Logging in...</p>
    </div>

    <script src="/public/notifications.js" defer></script>
    <script src="/public/shared.js"></script>
</body>

</html>
