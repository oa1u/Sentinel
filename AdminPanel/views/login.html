<!DOCTYPE html>
<!-- Login — sign-in page for Admin Panel accounts. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="websiteNameTitle">Login</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="/public/login.js" defer></script>
    <style>
        :root {
            --login-bg: #0f0f13;
            --login-accent: #5b7fff;
            --login-card-bg: rgba(30, 30, 35, 0.6);
            --login-border: rgba(255, 255, 255, 0.06);
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--login-bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            background-size: cover;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #fff;
            margin: 0;
            overflow: hidden;
        }
        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }
        .shape-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #5b7fff;
        }
        .shape-2 {
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: #7f5bff;
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }
        
        .form-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: rgba(30, 32, 40, 0.97);
            border-radius: 18px;
            box-shadow: 0 18px 36px -10px rgba(0,0,0,0.45);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.07);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .form-title {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-title::before {
            content: '🔒';
            font-size: 2.2rem;
            filter: drop-shadow(0 8px 28px rgba(91,127,255,0.12));
        }
        .form-subtitle {
            color: #9aa0b3;
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: #d1d1e0;
            margin-bottom: 0.5rem;
        }
        .form-input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.5rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.055);
            border-radius: 10px;
            color: #eef2ff;
            font-size: 1rem;
        }
        .form-input::placeholder {
            color: rgba(255,255,255,0.45);
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 0.9rem;
            color: #9aa0b3;
            pointer-events: none;
            font-size: 1.2rem;
        }
        .btn-full {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-top: 1.15rem;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #5b7fff 0%, #4f6be0 100%);
            border: none;
            color: white;
            box-shadow: 0 8px 30px rgba(91,127,255,0.12);
        }
        .btn-primary:hover {
            box-shadow: 0 12px 40px rgba(91,127,255,0.16);
        }
        .message {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .message.error {
            background: rgba(220,53,69,0.12);
            border: 1px solid rgba(220,53,69,0.25);
            color: #ff8fa3;
        }
        .message.success {
            background: rgba(40,167,69,0.12);
            border: 1px solid rgba(40,167,69,0.25);
            color: #75ec9c;
        }
        .text-center {
            text-align: center;
        }
        .text-secondary {
            color: #b3b3b3;
        }
        @media (max-width: 600px) {
            .auth-card {
                padding: 1.2rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
    <div class="form-container">
        <div class="auth-card">
            <h1 class="form-title"><span class="websiteName"></span></h1>
            <p class="form-subtitle">Sign in to access your dashboard</p>

            <div id="errorMsg" class="message error hidden"></div>
            <div id="successMsg" class="message success hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
                        <span class="input-icon">👤</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <button type="button" id="loginBtn" class="btn btn-primary btn-full">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <p class="text-secondary">Don't have an account? <a href="/register" id="registerLink">Create one here</a></p>
            </div>
        </div>
    </div>


    <div class="loading" id="loading" style="display:none;">
        <div class="spinner"></div>
        <p>Logging in...</p>
    </div>

    <script src="/public/notifications.js" defer></script>
    <script src="/public/shared.js"></script>
</body>
</html>
